<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Digital Healthcare & Medicine Reminder</title>
    <style>
        :root { --primary: #2563eb; --primary-hover: #1d4ed8; --bg: #f0f4f8; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --focus-ring: rgba(37, 99, 235, 0.2); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(135deg, #e0f2fe 0%, #f8fafc 50%, #dbeafe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--text); }
        .auth-card { background: var(--card); width: 100%; max-width: 460px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 1.75rem; }
        .logo { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 0.25rem; }
        .header p { color: var(--text-muted); font-size: 0.95rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; transition: all 0.2s; background: #fafbfc; }
        .input-wrapper input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--focus-ring); background: #fff; }
        .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.1rem; pointer-events: none; }
        .role-selector { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        .role-btn { flex: 1; padding: 0.75rem; border: 1.5px solid var(--border); border-radius: 8px; background: #fafbfc; cursor: pointer; text-align: center; font-weight: 500; transition: all 0.2s; }
        .role-btn:hover { border-color: var(--primary); background: #f0f7ff; }
        .role-btn.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); font-weight: 600; box-shadow: 0 0 0 2px var(--focus-ring); }
        .role-input { display: none; }
        .submit-btn { width: 100%; padding: 0.9rem; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .footer { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); }
        .footer a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .auth-card { padding: 1.5rem; } }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="header">
            <div class="logo">🏥</div>
            <h1>Create Account</h1>
            <p>Join our digital healthcare platform</p>
        </div>
        <form action="register.php" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" name="fullname" placeholder="John Doe" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">📧</span>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" name="password" placeholder="Min 6 characters" required minlength="6">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number (Optional)</label>
                <div class="input-wrapper">
                    <span class="input-icon">📱</span>
                    <input type="tel" name="phone" placeholder="+8801XXXXXXXXX">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">I am a</label>
                <div class="role-selector">
                    <label class="role-btn active">
                        <input type="radio" name="role" value="Patient" class="role-input" checked>
                        👤 Patient
                    </label>
                    <label class="role-btn">
                        <input type="radio" name="role" value="Doctor" class="role-input">
                        🩺 Doctor
                    </label>
                </div>
            </div>
            <button type="submit" class="submit-btn">✨ Create Account</button>
        </form>
        <div class="footer">
            Already have an account? <a href="login.html">🔐 Login here</a>
        </div>
    </div>
    <script>
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                this.querySelector('input').checked = true;
            });
        });
    </script>
</body>
</html>
